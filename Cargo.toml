[workspace]
resolver = "2"
members = ["crates/x402", "crates/cli"]

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/aetelierxyz/aetelier-ledger"

[workspace.dependencies]
aetelier-ledger-x402 = { path = "crates/x402" }

base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", default-features = false, features = [
  "derive",
  "env",
  "error-context",
  "help",
  "std",
  "usage"
] }
reqwest = { version = "0.12", default-features = false, features = [
  "http2",
  "json",
  "rustls-tls"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync"
] }
url = "2"

bincode = "=1.3.3"
solana-address = { version = "=2.9.0", features = ["curve25519", "decode", "serde"] }
solana-hash = { version = "=4.7.0", features = ["copy", "decode", "serde"] }
solana-instruction = { version = "=4.0.0", features = ["std"] }
solana-message = { version = "=6.0.0", features = ["serde"] }
solana-transaction = { version = "=6.0.0", features = ["serde"] }
solana-signature = { version = "=3.6.0", features = ["serde", "verify"] }
solana-keypair = "=4.0.0"
solana-signer = "=4.0.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
